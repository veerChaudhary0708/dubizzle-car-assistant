[project]
name = "dubizzle-car-assistant"
version = "0.1.0"
description = "A conversational assistant for the supplied used-car inventory"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=1.30,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "streamlit>=1.42,<2",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
